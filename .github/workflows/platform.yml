name: Platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hostrun:
    name: hostrun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Test hostrun
        run: go test ./internal/hostrun/...
      - name: Test hostrun callers
        if: runner.os == 'Linux'
        run: go test ./internal/engine/... ./internal/discovery/... ./internal/subject/...
      - name: Vet and build for Windows and macOS
        if: runner.os == 'Linux'
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go build ./...
          GOOS=darwin go build ./...
